name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # GitHub #46: wie Vercel (24.x). Node 20 findet die *.test.ts-Dateien
          # nicht -- `node --test` lief dort mit 0 Tests "grün".
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Unit tests (fail if none ran)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
          grep -Eq '^(ℹ|#) tests [1-9][0-9]*' test-output.log || { echo "::error::node --test hat keine Tests ausgeführt"; exit 1; }
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
