name: Refactoring
description: Behavior-preserving structural improvement
title: "[Refactor] "
labels: ["type:refactor", "status:needs-decision"]
body:
  - type: textarea
    id: context
    attributes: {label: Problem / Ausgangslage}
    validations: {required: true}
  - type: textarea
    id: target
    attributes: {label: Target Design and Invariants}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance Criteria, placeholder: "- [ ] …"}
    validations: {required: true}
  - type: textarea
    id: tests
    attributes: {label: Required Tests / Regression Protection}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: Out of Scope / Dependencies / Risks}
