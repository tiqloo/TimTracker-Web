name: Bug
description: Reproducible incorrect behavior or regression
title: "[Bug] "
labels: ["type:bug", "status:needs-decision"]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem / Ausgangslage}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Steps to reproduce, placeholder: "1. …\n2. …\n3. …"}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected Behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual Behavior}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Environment / Evidence, description: "Version, browser, logs with secrets removed, screenshots."}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance Criteria, placeholder: "- [ ] …"}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: Edge Cases / Out of Scope / Dependencies}
