name: Security
description: Non-sensitive security hardening or a disclosed security task
title: "[Security] "
labels: ["type:security", "priority:P1", "status:needs-decision"]
body:
  - type: markdown
    attributes: {value: "Do not publish exploitable secrets or undisclosed vulnerability details. Use a private security advisory when needed."}
  - type: textarea
    id: threat
    attributes: {label: Threat / Problem / Ausgangslage}
    validations: {required: true}
  - type: dropdown
    id: severity
    attributes: {label: Proposed Severity, options: [P0 critical, P1 high, P2 medium, P3 low]}
    validations: {required: true}
  - type: textarea
    id: impact
    attributes: {label: Impact and Affected Surface}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance Criteria / Verification, placeholder: "- [ ] …"}
    validations: {required: true}
  - type: textarea
    id: rollout
    attributes: {label: Dependencies / Rollout / Disclosure Notes}
